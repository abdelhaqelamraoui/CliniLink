# CliniLink local infrastructure.
# Start with: docker compose -f infra/docker-compose.yml up -d --build

services:
  rabbitmq:
    build: ./rabbitmq
    image: clinilink/rabbitmq:1.0
    container_name: clinilink-rabbitmq
    hostname: rabbitmq   # RabbitMQ stores data per node name, so keep the hostname fixed
    ports:
      - "5672:5672"     # AMQP (services)
      - "15672:15672"   # management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq-data:
