# CliniLink frontend on its own.
#
# Production build (same image as infra/docker-compose.yml):
#   docker compose up -d --build                 -> http://localhost:3000
#
# Development with hot reload (edit files locally, the page updates):
#   docker compose --profile dev up --build frontend-dev   -> http://localhost:3001
#
# Stop: docker compose --profile dev down

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: clinilink/frontend:0.1
    container_name: clinilink-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: clinilink/frontend:dev
    container_name: clinilink-frontend-dev
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      # File events from the host don't always reach the container; polling makes reload reliable.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Keep the container's own node_modules and build cache (Linux binaries), not the host's.
      - /app/node_modules
      - /app/.next
